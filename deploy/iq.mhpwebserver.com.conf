# deploy/iq.mhpwebserver.com.conf  →  /etc/nginx/sites-available/
# Static only: the IQ is filled in the visitor's browser; nothing is uploaded.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name iq.mhpwebserver.com;

    ssl_certificate     /etc/letsencrypt/live/mhpwebserver.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhpwebserver.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/robots-noindex.conf;
    include /etc/nginx/snippets/deny-vcs.conf;

    root /var/www/iq.mhpwebserver.com;
    index index.html;

    location / {
        include /etc/nginx/snippets/noindex.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location /vendor/ {
        include /etc/nginx/snippets/noindex.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
}
